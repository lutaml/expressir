[package]
name = "expressir-core"
version = "0.1.0"
edition = "2021"
description = "Rust core for Expressir: EXPRESS schema parsing and model building on parsanol"
license = "MIT"
repository = "https://github.com/lutaml/expressir"
publish = false

[dependencies]
parsanol = { version = "0.7.3" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"

[lib]
name = "expressir_core"
