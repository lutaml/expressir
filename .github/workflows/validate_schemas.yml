name: "validate_schemas"

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

jobs:
  # The shards split the manifest by line position, so every one of them has
  # to read the same revision of it. Left to themselves they each resolve the
  # default branch when they happen to start, and a push to iso-10303 midway
  # through could reorder the manifest under them: each shard stays non-empty,
  # the counts still look right, and a schema is silently never validated.
  # Resolving the revision once and pinning every checkout to it closes that.
  resolve-schemas-revision:
    name: Pin iso-10303 revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Resolve iso-10303 HEAD
        id: pin
        env:
          GH_TOKEN: ${{ secrets.LUTAML_CI_PAT_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(gh api repos/metanorma/iso-10303/commits/HEAD --jq .sha)
          # An empty answer here would be handed to `actions/checkout` as an
          # empty `ref`, which quietly falls back to the default branch and
          # puts back exactly the drift this job exists to remove.
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::could not resolve iso-10303 HEAD, got '$sha'"
            exit 1
          fi
          echo "::notice::pinned iso-10303 to $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  schemas:
    name: Validate schemas
    runs-on: ubuntu-latest
    needs: resolve-schemas-revision
    strategy:
      fail-fast: false
      matrix:
        # The module group carries the bulk of the schemas and has run for
        # anywhere between 1.5 and 3 hours, so it is split across runners.
        # The other two are short enough that a split would cost more in
        # setup than it saves.
        include:
          - { test-group: 'iso-10303/schemas-srl.yml', shard: 1, shards: 1 }
          - { test-group: 'iso-10303/schemas_bom.yml', shard: 1, shards: 1 }
          - { test-group: 'iso-10303/schemas_module.yml', shard: 1, shards: 4 }
          - { test-group: 'iso-10303/schemas_module.yml', shard: 2, shards: 4 }
          - { test-group: 'iso-10303/schemas_module.yml', shard: 3, shards: 4 }
          - { test-group: 'iso-10303/schemas_module.yml', shard: 4, shards: 4 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: 'metanorma/iso-10303'
          ref: ${{ needs.resolve-schemas-revision.outputs.sha }}
          path: iso-10303
          token: ${{ secrets.LUTAML_CI_PAT_TOKEN }}

      - name: Install Ruby
        uses: ruby/setup-ruby@master
        with:
          ruby-version: 3.2
          bundler-cache: true
          cache-version: 0 # Increment this number if you need to re-download cached gems

      - name: Validate schemas ${{ matrix.test-group }} (${{ matrix.shard }}/${{ matrix.shards }})
        run: |
          set -euo pipefail
          all="$RUNNER_TEMP/all-schemas.txt"
          shard="$RUNNER_TEMP/shard-schemas.txt"
          yq '.schemas[].path | sub("schemas", "iso-10303/schemas")' "${{ matrix.test-group }}" > "$all"
          awk 'NR % ${{ matrix.shards }} == ${{ matrix.shard }} % ${{ matrix.shards }}' "$all" > "$shard"
          # awk rather than `wc -l`, which counts newlines rather than lines and
          # so reports one fewer if the last path ever arrives unterminated.
          total=$(awk 'END { print NR }' "$all")
          count=$(awk 'END { print NR }' "$shard")
          if [ "$total" -eq 0 ]; then
            echo "::error::${{ matrix.test-group }} produced no schema paths"
            exit 1
          fi
          # Add these up across the shards when reading the logs: they should
          # come to the total, and a job cannot check that on its own.
          echo "shard ${{ matrix.shard }}/${{ matrix.shards }}: $count of $total schemas"
          if [ "$count" -eq 0 ]; then
            echo "::notice::no schemas in this shard, the manifest holds fewer than ${{ matrix.shards }}"
            exit 0
          fi
          # NUL separated so a path is taken literally: bare xargs reads quotes
          # and backslashes in a filename as syntax and would validate the
          # wrong file. `-0` works on any xargs, unlike GNU's `-d`.
          tr '\n' '\0' < "$shard" | xargs -0 bundle exec ./exe/expressir validate load

