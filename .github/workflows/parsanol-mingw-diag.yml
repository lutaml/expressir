# parsanol-ruby#205 diagnostic: the x64-mingw-ucrt native deadlock at
# the first heavy native parse (expressir#487). Each probe runs in its
# own child process with a hard timeout; on hang the parent samples CPU
# (spin vs block), captures a minidump when procdump is present, kills
# the child, and moves on. Ladder v2 proved parsanol's own precompiled
# ext clean even under load, so the axis is now the expressir-rs core
# tag (v0.1.3 = parsanol 0.8.8 engine vs v0.1.4 = 0.8.9, magnus 0.9 in
# both) with the rungs driving the core path (from_file defaults).
name: parsanol-mingw-diag

on:
  push:
    branches: [diag/parsanol-mingw-hang]
  workflow_dispatch:

concurrency:
  group: parsanol-mingw-diag
  cancel-in-progress: true

jobs:
  ladder:
    name: mingw ladder (expressir-rs ${{ matrix.core_pin }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        core_pin: ["v0.1.4"]
    env:
      CORE_PIN: ${{ matrix.core_pin }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Pin expressir-rs core and install
        shell: pwsh
        run: |
          (Get-Content ext/expressir_core/Cargo.toml) -replace 'tag = "v0\.1\.\d+"', ('tag = "' + $env:CORE_PIN + '"') | Set-Content ext/expressir_core/Cargo.toml
          Select-String -Path ext/expressir_core/Cargo.toml -Pattern "tag|parsanol|magnus"
          bundle config set --local frozen false
          bundle install --jobs 3
          bundle info parsanol

      - name: Run mingw hang ladder
        shell: pwsh
        run: bundle exec ruby .github/diag/parsanol_mingw_ladder.rb

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mingw-diag-core-${{ matrix.core_pin }}
          path: dumps/
          if-no-files-found: ignore
