[package]
name = "expressir-core"
version = "0.1.0"
edition = "2021"
description = "Rust core for Expressir: EXPRESS schema parsing and model building on parsanol"
license = "MIT"
repository = "https://github.com/lutaml/expressir"
publish = false

[dependencies]
# Pinned to the parslet-transform parity fixes (parsanol-rs#83); move to
# a released version once that ships.
parsanol = { git = "https://github.com/parsanol/parsanol-rs", rev = "993dad5" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"

[lib]
name = "expressir_core"
