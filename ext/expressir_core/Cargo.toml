[package]
name = "expressir_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "expressir_core"
crate-type = ["cdylib"]

[dependencies]
magnus = { version = "0.9" }
expressir-rs = { git = "https://github.com/lutaml/expressir-rs", branch = "main" }
serde_json = "1.0"

# Standalone workspace: the repo root workspace owns crates/, the ext
